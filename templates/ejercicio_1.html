<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>Document</title>
    
</head>
<body>
    
    <form action="{{ url_for('ejercicio1') }}" method="POST">
        <h3>Formulario de notas</h3>
        <div class = "nota">
            <label for="nota1">Nota 1:</label>
            <input id = "nota1", name = "nota1", type="number", min= "10", max="70", required>
        </div>
        <div class = "nota">
            <label for="nota2">Nota 2:</label>
            <input id = "nota2", name = "nota2", type="number", min= "10", max="70", required>
        </div>
        <div class = "nota">
        <label for="nota3">Nota 3:</label>
        <input id = "nota3", name = "nota3", type="number", min= "10", max="70", required >
        </div>
        <div class = "nota">
            <label for="asistencia">Asistencia (%):</label>
            <input id = "asistencia", name = "asistencia", type="number", min= "0", max="100", required>
        </div>

        <div class = "nota">
            <button type = "submit">Enviar</button>
        </div>

        <div class = "resultado">
            {% if promedio is defined %}
            <p>{{ "%.1f"|format(promedio) }}</p>
            <p>{% if aprobado %}Aprobado{% else %}Reprobado{% endif %}</p>
            {% endif %}
        </div>
        
    </form>

    

    <a href="{{ url_for('inicio') }}">
    <button>Inicio</button>
    </a>

</body>
</html>
